# Ultralytics YOLO11 object detection model with P3/8 - P5/32 outputs
# Model docs: https://docs.ultralytics.com/models/yolo11
# Task docs: https://docs.ultralytics.com/tasks/detect

# Parameters
nc: 9 # number of classes - CHANGED from 80 to 9
scales: # model compound scaling constants, i.e. 'model=yolo11n.yaml' will call yolo11.yaml with scale 'n'
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 181 layers, 2624080 parameters, 2624064 gradients, 6.6 GFLOPs
  s: [0.50, 0.50, 1024] # summary: 181 layers, 9458752 parameters, 9458736 gradients, 21.7 GFLOPs
  m: [0.50, 1.00, 512] # summary: 231 layers, 20114688 parameters, 20114672 gradients, 68.5 GFLOPs
  l: [1.00, 1.00, 512] # summary: 357 layers, 25372160 parameters, 25372144 gradients, 87.6 GFLOPs
  x: [1.00, 1.50, 512] # summary: 357 layers, 56966176 parameters, 56966160 gradients, 196.0 GFLOPs

# YOLO11n backbone with C3k2_DSConv
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2_DSConv, [256, False, 0.25]] # 2 CHANGED: C3k2 to C3k2_DSConv
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2_DSConv, [512, False, 0.25]] # 4 CHANGED: C3k2 to C3k2_DSConv
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2_DSConv, [512, True]] # 6 CHANGED: C3k2 to C3k2_DSConv
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2_DSConv, [1024, True]] # 8 CHANGED: C3k2 to C3k2_DSConv
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO11n head with C3k2_DSConv
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2_DSConv, [512, False]] # 13 CHANGED: C3k2 to C3k2_DSConv

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 3, C3k2_DSConv, [256, False]] # 16 (P3/8-small) CHANGED: C3k2 to C3k2_DSConv and repeats from 2 to 3

  - [-1, 1, Conv, [256, 3, 2]] # 17
  - [[-1, 13], 1, Concat, [1]] # 18 cat head P4
  - [-1, 3, C3k2_DSConv, [512, False]] # 19 (P4/16-medium) CHANGED: C3k2 to C3k2_DSConv and repeats from 2 to 3

  - [-1, 1, Conv, [512, 3, 2]] # 20
  - [[-1, 10], 1, Concat, [1]] # 21 cat head P5
  - [-1, 3, C3k2_DSConv, [1024, True]] # 22 (P5/32-large) CHANGED: C3k2 to C3k2_DSConv and repeats from 2 to 3

  - [[16, 19, 22], 1, Detect, [nc]] # 23 Detect(P3, P4, P5) -
